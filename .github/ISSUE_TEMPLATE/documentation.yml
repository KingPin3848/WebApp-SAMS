name: Documentation issue
description: Report missing, incorrect, or confusing SAMS documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document or section
      description: Include the file path or documentation heading.
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: What is wrong?
      options:
        - Missing information
        - Incorrect or outdated information
        - Unclear explanation
        - Broken link
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What needs to be corrected or added?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
